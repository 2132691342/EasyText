name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build / vet / test)
    # 应用为 Windows 专属（fileassoc/singleinstance/tray 依赖 Win32 API），
    # 测试必须在目标平台上编译运行。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1 -timeout 120s

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # wailsjs 绑定已提交进仓库，前端无需安装 Wails CLI
      - name: Install deps
        run: npm ci

      # build 已包含 vue-tsc --noEmit 类型检查
      - name: Build
        run: npm run build
